<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>reizoo</title>
  <meta name="description" content="reizoo: links">
  <meta name="theme-color" content="#0b0b0c">
  <meta property="og:title" content="reizoo">
  <meta property="og:description" content="links">
  <meta property="og:image" content="https://reizedup.cc/media/avatar.webp">
  <link rel="icon" href="/media/avatar.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;700&display=swap">

  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/backdrop.css">
  <link rel="stylesheet" href="/css/card.css">
  <link rel="stylesheet" href="/css/links.css">
  <link rel="stylesheet" href="/css/footer.css">

  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <!-- Background layers -->
  <video id="bg" src="/media/bg.mp4" poster="/media/poster.jpg" autoplay muted loop playsinline preload="auto"></video>
  <div class="shade"></div>
  <canvas id="snow"></canvas>
  <audio id="song" src="/media/song.mp3" loop preload="none"></audio>

  <!-- "Click to enter" screen. Browsers only allow music after a click. -->
  <div id="enter" role="button" tabindex="0" aria-label="Enter">
    <span>click to enter...</span>
  </div>

  <main>
    <section class="card" id="card">
      <img class="avatar" src="/media/avatar.webp" alt="reizoo avatar" width="104" height="104">

      <div class="name-row">
        <h1>reizoo</h1>
        <img class="sticker" src="/media/status.webp" alt="" title="status">
      </div>
      <div class="badge-row">
        <span class="badge" title="developer">&lt;/&gt; dev</span>
      </div>

      <p class="typed" id="typed"></p>
      <span class="location">⌖ Kursk Psychiatric Hospital</span>

      <!-- Filled from js/config.js -->
      <nav class="socials" id="socials" aria-label="Social"></nav>
      <div class="links" id="links"></div>

      <footer class="footer">
        <span id="views">◉ — views</span>
        <span id="clock" title="my local time">◷ --:--</span>
        <button type="button" id="mute" aria-label="Mute music">♪ <span>on</span></button>
      </footer>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>
</body>
</html>
